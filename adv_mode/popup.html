<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Input Assistant</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M12 7L12 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M7 9.5L17 9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M7 14.5L17 14.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Smart Input</h1>
                    <p>AI-powered typing assistant</p>
                </div>
            </div>
            <div class="status-indicator" id="status-indicator">
                <div class="status-dot"></div>
            </div>
        </div>
        <div class="main-controls">
            <div class="toggle-section">
                <label class="toggle-label">
                    <span>Enable Extension</span>
                    <div class="toggle-switch">
                        <input type="checkbox" id="enabled-toggle">
                        <span class="slider"></span>
                    </div>
                </label>
            </div>
            <div class="mode-section" id="mode-section">
                <h3>Select Mode</h3>
                <div class="mode-options">
                    <div class="mode-card" data-mode="habit">
                        <div class="mode-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 3H21V9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M9 21H3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M21 3L13.5 10.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M10.5 13.5L3 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="mode-content">
                            <h4>Habit Mode</h4>
                            <p>Enhanced typing with floating input box</p>
                        </div>
                        <div class="mode-radio">
                            <input type="radio" name="mode" value="habit" id="habit-mode">
                        </div>
                    </div>
                    <div class="mode-card" data-mode="advanced">
                        <div class="mode-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9.75 17L9 20L20 20L19.25 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M3 13H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M12 4V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M8 4L16 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="mode-content">
                            <h4>AI Mode</h4>
                            <p>Gemini AI-powered content generation</p>
                        </div>
                        <div class="mode-radio">
                            <input type="radio" name="mode" value="advanced" id="advanced-mode">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="quick-actions">
            <button id="save-settings" class="btn btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16L21 8V19C21 20.1046 20.1046 21 19 21Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M17 21V13H7V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 3V8H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Save Settings
            </button>
            <button id="reset-settings" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 4V10H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M23 20V14H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14L18.36 18.36A9 9 0 0 1 3.51 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Reset
            </button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
