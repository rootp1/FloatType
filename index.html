<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Input Box Popup</title>
</head>
<body style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
<div style="
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999999;
  background: white;
  border: 2px solid #4285f4;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  padding: 12px;
  display: block; /* or 'none' if hidden */
  min-width: 400px;
  max-width: 80vw;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
  <div style="
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
    color: #666;
  ">
    <span style="font-weight: 500;">📝 Smart Input Box (Habit Mode)</span>
    <button style="
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #666;
      padding: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    ">✕</button>
  </div>
  <textarea placeholder="Type here - synced with focused input..." style="
    width: 100%;
    min-height: 40px;
    max-height: 200px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    box-sizing: border-box;
  "></textarea>
  <div style="
    margin-top: 6px;
    font-size: 11px;
    color: #888;
    text-align: center;
  ">
    Ctrl+Shift+H to toggle • ESC to close
  </div>
</div>

</body>
</html>
