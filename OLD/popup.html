<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        
        .header p {
            margin: 4px 0 0 0;
            font-size: 12px;
            color: #666;
        }
        
        .section {
            margin-bottom: 16px;
        }
        
        .section h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #333;
        }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }
        
        .toggle-switch label {
            font-size: 14px;
            color: #333;
            cursor: pointer;
        }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .slider {
            background-color: #4285f4;
        }
        
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        .shortcuts {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .shortcuts h4 {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #333;
        }
        
        .shortcut {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        
        .shortcut:last-child {
            margin-bottom: 0;
        }
        
        .key {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 11px;
        }
        
        .status {
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 12px;
        }
        
        .status.enabled {
            background: #e8f5e8;
            color: #2e7d2e;
        }
        
        .status.disabled {
            background: #ffe8e8;
            color: #d32f2f;
        }
        
        .description {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 Smart Input Box</h1>
        <p>Bring input boxes to eye level</p>
    </div>
    
    <div class="section">
        <div class="toggle-switch">
            <label for="extensionToggle">Extension Enabled</label>
            <label class="switch">
                <input type="checkbox" id="extensionToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    
    <div class="section">
        <h3>Modes</h3>
        <div class="toggle-switch">
            <div>
                <label for="habitModeToggle">Habit Mode</label>
                <div class="description">Show floating input box when any input is focused</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="habitModeToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>
    
    <div class="shortcuts">
        <h4>⌨️ Keyboard Shortcuts</h4>
        <div class="shortcut">
            <span>Toggle Extension</span>
            <span class="key">Ctrl+Shift+I</span>
        </div>
        <div class="shortcut">
            <span>Toggle Habit Mode</span>
            <span class="key">Ctrl+Shift+H</span>
        </div>
        <div class="shortcut">
            <span>Close Floating Box</span>
            <span class="key">ESC</span>
        </div>
    </div>
    
    <div id="status" class="status"></div>
    
    <script src="popup.js"></script>
</body>
</html>
